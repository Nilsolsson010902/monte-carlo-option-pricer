[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "option-pricer"
version = "0.1.0"
description = "Option pricing engine with Black-Scholes, Monte Carlo, implied volatility, and binomial pricing"
authors = [{ name = "Nils Olsson" }]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
]

[project.scripts]
option-price = "option_pricer.cli:main"